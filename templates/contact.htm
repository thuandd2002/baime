{slideshow}
<div class="c"></div>
{pathpage}
<div class="c20"></div>
<div class="grid">

  <div>

    <div class="c10"></div>
    <h1 class="contact-title">
      {contactname}
    </h1>
    <div class="c10"></div>

    <div class="flex-container flex-space-between">
      <div class="cell-1-2 mobile-cell-1-1 tab-cell-1-1 margin-bottom-20">
        <div class="frm-contact">
          <div class="c10"></div>


          <form action="{dir_path}/index4.php?page=contact&lang={lang}" method="post" id="contactform"
            data-alert="{_ban_can_nhap_thong_tin}" data-captcha="{_captcha_invalid}" data-success="{_thong_tin_lien_he}"
            data-redirect="/contact-success/">

            <input type="hidden" name="code" value="save" />
            <input type="hidden" name="csrf_token" value="{csrf_token}">

            <div class="">
              <strong>Điền thông tin liên hệ</strong>
              <div class="c10"></div>
              <div class="flex-container flex-space-between">
                <div class="cell-1-2 tab-cell-1-1">
                  <div class="line-title">{_fullname}<span>*</span></div>
                  <div class="line-frm">
                    <input name="yourname" type="text" class="txt-contact notNull" id="yourname" />
                  </div>
                </div>
                <div class="cell-1-2 tab-cell-1-1">
                  <div class="line-title">{_phone}<span>*</span></div>
                  <div class="line-frm">
                    <input name="phone" type="text" class="txt-contact notNull" />
                  </div>
                </div>
                <div class="cell-1-2 tab-cell-1-1">
                  <div class="line-title">{_addresscontact}</div>
                  <div class="line-frm">
                    <input name="address" type="text" class="txt-contact notNull" />
                  </div>
                </div>

                <div class="cell-1-2 tab-cell-1-1 margin-bottom-20">
                  <div class="line-title">Email</div>
                  <div class="line-frm">
                    <input name="email" type="text" class="txt-contact notNull" />
                  </div>
                </div>
                <div class="cell-1-1 tab-cell-1-1">
                  <div class="line-title">{_content}<span>*</span></div>
                  <div class="line-frm">
                    <input name="other_request" type="text" class="txt-contact notNull" />
                  </div>
                </div>
                <div class="cell-1-2 tab-cell-1-1">
                  <div class="c15"></div>
                  <div style="position:relative;">
                    <input class="txt-contact notNull" placeholder="Enter Captcha" name="sercurity" />
                    <img src="{dir_path}/lib/imagesercurity.php?recaptcha=n" name="imgCaptcha" align="absmiddle"
                      class="imgCaptcha newsletter-capt-img"
                      style="height: 35px; position: absolute; top: 0px; right: 0px; " />

                  </div>


                </div>

                <div class="cell-1-2 mobile-cell-1-1 margin-bottom-20">
                  <div class="c15"></div>
                  <input name="input" type="button" onClick="$('#contactform').submit()" class="btn-contact"
                    value="{_send}" />
                </div>
              </div>
              <div class="c10"></div>
              <div class="msgbox" style="font-size: 16px;"> </div>
            </div>
          </form>
          <div class="c10"></div>
        </div>
      </div>
      <div class="cell-1-2 mobile-cell-1-1 tab-cell-1-1">
        <iframe allowfullscreen="" height="530" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7448.342900309471!2d105.81932147590295!3d21.02582478787833!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab71380a0d73%3A0x57f7ac73226e079!2zRDIgUC4gR2nhuqNuZyBWw7UsIEtodSB04bqtcCB0aOG7gyBHaeG6o25nIFbDtSwgR2nhuqNuZyBWw7UsIEjDoCBO4buZaSAxMDAwMDAsIFZp4buHdCBOYW0!5e0!3m2!1svi!2s!4v1781149124192!5m2!1svi!2s" style="border:0;" width="100%"></iframe>
        {catcontent}
      </div>
    </div>
    <div class="c30"></div>
  </div>

</div>
<div class="c10"></div>
<style>
  .contact-title {
  font-size: 36px;
  font-family: var(--fontB);
  color: #222;
  text-align: center;
  margin-bottom: 30px;
}

.frm-contact {
  background: #fff;
  padding: 35px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

.line-title {
  font-family: var(--fontSemi);
  font-size: 15px;
  color: #333;
  margin-bottom: 8px;
}

.line-title span {
  color: #e53935;
}

.line-frm {
  margin-bottom: 18px;
}

.txt-contact {
  width: 100%;
  height: 50px;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 0 15px;
  font-size: 15px;
  font-family: var(--fontmain);
  transition: all .3s ease;
  background: #fff;
}

.txt-contact:focus {
  border-color: var(--maincolor);
  box-shadow: 0 0 0 4px rgba(38, 142, 205, 0.12);
  outline: none;
}

textarea.txt-contact {
  height: 140px;
  padding: 15px;
  resize: vertical;
}

.btn-contact {
  background: var(--maincolor);
  color: #fff;
  border: none;
  height: 50px;
  padding: 0 40px;
  border-radius: 8px;
  font-family: var(--fontSemi);
  font-size: 15px;
  cursor: pointer;
  transition: all .3s ease;
}

.btn-contact:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(38, 142, 205, 0.25);
}

.newsletter-capt-img {
  border-radius: 6px;
  border: 1px solid #ddd;
}

.msgbox {
  padding: 12px 15px;
  border-radius: 8px;
}

.contact-info {
  background: #fff;
  padding: 35px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  height: 100%;
}
</style>
