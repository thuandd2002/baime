<!-- START BLOCK : itemList  -->

<div class="hethong-wrapper">
  <div class="grid">

    <h1 class="homecat-title">{catname}</h1>

    <div class="c10"></div>
    <div class="info-desc">
      {catintro}
      <div class="c5"></div>
      {catcontent}

    </div>

    <div class="flex-container">

      <!-- START BLOCK : lstDaily  -->

      <div class="cell-1-3 pad-cell-1-2 tab-cell-1-1 hethong-wrap">
        <div class="hethong-card">
          <img src="{img_url}" alt="">
          <div class="hethong-item">
            <h3 class="hethong-name">{name}</h3>
          </div>
          <div class="c10"></div>
          <div class="hethong-box">
            <table border="0" cellpadding="0" cellspacing="0" class="hethong-table"
              style="border-collapse:collapse;width:100%;">
              <tbody>
                <tr>
                  <td style="width: 22px;">
                    <img src="/images/icon/location.png" alt="">
                  </td>
                  <td colspan="2" rowspan="1"><span style="font-family: 'Muli-B';">Địa chỉ:</span> {address}</td>
                </tr>
                <tr>
                  <td><img src="/images/icon/phone.png" alt=""></td>
                  <td><span style="font-family: 'Muli-B';">ĐT:</span> {phone}</td>
                  <!-- <td><span style="font-family: 'Muli-B';">FAX:</span> {fax}</td> -->
                </tr>
                <tr>
                  <td><img src="/images/icon/location.png" alt=""></td>
                  <td colspan="2" rowspan="1"><span style="font-family: 'Muli-B';">Email:</span>{email}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="c20"></div>
          <a href="{linkmap}" class="view-map-btn">Chỉ dẫn đường đi <i class="fa fa-angle-right viewmap-btn-icon"></i></a>
        </div>

      </div>

      <!-- END BLOCK : lstDaily  -->

      <div class="cell-1-3"></div>
      <div class="cell-1-3"></div>
    </div>
  </div>
</div>

<!-- End Hệ thống phân phối -->
