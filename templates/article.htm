{slideshow}
<div class="c"></div>
{pathpage}
<div class="c20"></div>

<div class="c20"></div>

<div class="grid">

  <!-- START BLOCK : itemList  -->

  <div class="c10"></div>

  <h1 class="title-page"><span>{catname}</span></h1>
  <div class="c10"></div>
  <div class="cat-content">{catintro} </div>
  <div class="c10"></div>

  <div class="flex-container flex-space-between article-list">
    <!-- START BLOCK : newsItem -->
    <div class="cell-1-4 tab-cell-1-2">
      <div class="article-card hvr-float">

        <div class="article-item-img">
          <a href="{link_detail}">
            {image}
          </a>
        </div>

        <h2 class="article-name text-line-2">
          <a href="{link_detail}">{name}</a>
        </h2>

        <div class="article-intro text-line-3 hide-on-mobile">
          {intro}
        </div>

      </div>
    </div>
    <!-- END BLOCK : newsItem -->
  </div>
  <div class="c20"></div>
  <div>{pages}</div>
  <div class="c20"></div>

  <!-- END BLOCK : itemList  -->


  <!-- START BLOCK : itemDetail  -->
  <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{site_address}{link_detail}"
        },
        "headline": "{name}",
        "image": [
        "{site_address}{image}"
        ],
        "datePublished": "{createdate}",
        "dateModified": "{createdate}",
        "author": {
        "@type": "Person",
        "name": "Admin"
        },
        "publisher": {
        "@type": "Organization",
        "name": "MRM",
        "logo": {
        "@type": "ImageObject",
        "url": "{site_address}/uploaded/logo/logo.png"
        }
        },
        "description": "{description}"
        }
    </script>

  <div class=" flex-space-between flex-container">
    <div class="cell-1-5 tab-cell-1-1">

      <div class="article-item-img" style="float: left; margin: 0px;">
        <a href="{link_detail}"> {image} </a>
      </div>
      <div class="c5"></div>


    </div>
    <div class="cell-4-5 tab-cell-1-1">
      <h1 class="title-news-detail" style="text-align:left"> {name}</h1>
      <div class="c20"></div>
      <div style="">
        <strong>{author_name}</strong>
        <div>{author_info}</div>
      </div>
      <div class="c10"></div>
      <div class="intro-detail">{intro}</div>

    </div>
  </div>


  <div class="c10"></div>
  <div class="content-detail ">
    {content}
  </div>
  <div class="c20"></div>

  <!-- AddThis Button BEGIN -->
  <div class="addthis_toolbox addthis_default_style "> <a class="addthis_button_facebook_like"
      fb:like:layout="button_count"></a> <a class="addthis_button_tweet"></a> <a class="addthis_button_google_plusone"
      g:plusone:size="medium"></a> <a class="addthis_counter addthis_pill_style"></a> </div>
  <!-- AddThis Button END -->
  <div class="c30"></div>



  <!-- END BLOCK : itemDetail  -->
</div>
<div class="c20"></div>
